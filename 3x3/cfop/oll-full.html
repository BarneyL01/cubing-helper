<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full OLL — Cubing Helper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fed'/%3E%3Cg stroke='white' stroke-width='2'%3E%3Cline x1='0' y1='11' x2='32' y2='11'/%3E%3Cline x1='0' y1='21' x2='32' y2='21'/%3E%3Cline x1='11' y1='0' x2='11' y2='32'/%3E%3Cline x1='21' y1='0' x2='21' y2='32'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../../css/style.css?v=4" />
  <script type="module" src="../../js/site-chrome.js?v=6"></script>
</head>
<body>
  <header class="site-header" id="site-header">
    <a class="brand" href="../../index.html">Cubing Helper</a>
  </header>

  <main>
    <h1>Full OLL</h1>
    <p class="subtitle">
      All 57 OLL cases, one standard algorithm each (yellow facing up). Standard notation only: no mnemonics, no Libby's
      digits. Your 2-look OLL is on its own page.
    </p>
    <div class="view-toggle" id="view-toggle"></div>
    <div id="picture-index"></div>
    <div id="full-oll-cases" class="case-grid"></div>
  </main>

  <script type="module">
    import { ollFullCases } from '../../data/oll-full.js';
    import { renderCases, renderPictureIndex } from '../../js/render-cases.js';
    import { mountViewToggle } from '../../js/view-toggle.js';
    mountViewToggle(document.getElementById('view-toggle'));
    renderCases('full-oll-cases', ollFullCases);
    renderPictureIndex('picture-index', [{ title: 'Full OLL', container: 'full-oll-cases' }]);
  </script>
</body>
</html>
