<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3x3 Blindfolded M2 edges — Cubing Helper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fed'/%3E%3Cg stroke='white' stroke-width='2'%3E%3Cline x1='0' y1='11' x2='32' y2='11'/%3E%3Cline x1='0' y1='21' x2='32' y2='21'/%3E%3Cline x1='11' y1='0' x2='11' y2='32'/%3E%3Cline x1='21' y1='0' x2='21' y2='32'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../../css/style.css?v=4" />
  <script type="module" src="../../js/site-chrome.js?v=3"></script>
</head>
<body>
  <header class="site-header" id="site-header">
    <a class="brand" href="../../index.html">Cubing Helper</a>
  </header>

  <main>
    <h1>M2 edges</h1>

    <h2 class="section-heading" id="edges-m2">Edges — M2</h2>
    <p class="subtitle">Setup, <strong>M2</strong>, undo the setup. Letters marked “special” have their own algorithm.</p>
    <div class="table-wrap"><table class="bld-table" id="bld-edges"></table></div>

    <h3 class="section-heading">Parity</h3>
    <p class="subtitle">Odd number of edge targets? After the edges, do either of these.</p>
    <div id="bld-parity" class="case-grid"></div>

  </main>

  <script type="module">
    import { bldEdges, BLD_PARITY } from '../../data/bld.js';
    import { invertAlg } from '../../js/algs.js';
    import { renderCases } from '../../js/render-cases.js';

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    };
    const code = (text) => el('code', null, text);

    function table(id, rows, core) {
      const t = document.getElementById(id);
      const head = t.createTHead().insertRow();
      ['Letter', 'Piece', 'Setup', `Undo (after ${core})`].forEach((h) => head.appendChild(el('th', null, h)));
      const body = t.createTBody();
      for (const r of rows) {
        const tr = body.insertRow();
        tr.id = `${id === 'bld-edges' ? 'edge' : 'corner'}-${r.letter}`;
        tr.appendChild(el('th', 'bld-letter', r.letter));
        tr.appendChild(el('td', 'bld-piece', r.piece));
        if (r.buffer) {
          const td = el('td', 'bld-muted', 'Buffer — never a target');
          td.colSpan = 2;
          tr.appendChild(td);
          tr.classList.add('bld-buffer-row');
          continue;
        }
        if (r.special) {
          const td = el('td');
          td.colSpan = 2;
          td.append(el('span', 'bld-tag', 'Special — whole algorithm, no M2'), el('br'), code(r.special));
          if (r.note) td.append(el('div', 'bld-note', r.note));
          tr.appendChild(td);
          continue;
        }
        const setup = el('td');
        setup.append(r.setup ? code(r.setup) : el('span', 'bld-muted', 'none'));
        if (r.alt) setup.append(el('div', 'bld-note', 'or '), code(r.alt));
        if (r.note) setup.append(el('div', 'bld-note', r.note));
        tr.appendChild(setup);
        const undo = el('td');
        undo.append(r.setup ? code(invertAlg(r.setup)) : el('span', 'bld-muted', '—'));
        if (r.alt) undo.append(el('div', 'bld-note', 'or '), code(invertAlg(r.alt)));
        tr.appendChild(undo);
      }
    }
    table('bld-edges', bldEdges, 'M2');

    renderCases('bld-parity', BLD_PARITY.map((alg, i) => ({
      name: `Parity algorithm ${i + 1}`,
      alg,
      noViewer: true,
      note: i === 0
        ? 'Both do exactly the same thing: swap the UL and UB edges, and undo the leftover M2 (UF/DB and the centres). Use whichever you prefer.'
        : undefined,
    })));
  </script>
</body>
</html>
